services:
  backend:
    build: 
      context: ./backend
      target: dev
    ports:
      - "3001:3000"
    command: >
      sh -c "bun run migrate && bun run start:dev"
    environment:
      - DATABASE_URL=postgresql://admin:BtoiKe22dLq00N78@db:5432/chess_platform?schema=public
      - REDIS_HOST=redis
      - PORT=3000
      - KEY=8Gs6MfIK9JE0CT22
      - GEMINI_KEY=AIzaSyCqKK67QHLslTaSQkWygaMMJB2-nqEeajw
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - redis
    environment:
      - WATCHPACK_POLLING=true
      - NEST_API_URL=http://backend:3000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3001

  #worker:
  #  build: ./worker
  #  depends_on:
  #    - redis
  #  deploy:
  #    resources:
  #      limits:
  #        cpus: '2.0'
  #        memory: 512M
  #  environment:
  #    - BACKEND_URL=http://backend:3000
  
  worker:
    build: ./worker_go
    restart: always
    environment:
      - REDIS_URL=redis:6379
      - BACKEND_URL=http://backend:3000
    volumes:
      - ./logs:/root/logs
    depends_on:
      - redis

  db:
    image: postgres:17-alpine 
    container_name: chess_platform
    restart: always
    ports:
      - "5432:5432" 
    environment:
      POSTGRES_USER: admin           
      POSTGRES_PASSWORD: BtoiKe22dLq00N78    
      POSTGRES_DB: chess_platform  
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chess_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  drizzle_studio:
    build:
      context: ./backend
      dockerfile: Dockerfile.studio
    container_name: drizzle_studio
    ports:
      - "4983:4983"
    environment:
      - DATABASE_URL=postgresql://admin:BtoiKe22dLq00N78@db:5432/chess_platform?schema=public
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data: