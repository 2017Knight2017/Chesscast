version: '3.8'

services:
  # 1. Backend (Nest.js)
  backend:
    build: ./backend
    expose:
      - "3000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/db

  # 2. Frontend (Next.js)
  frontend:
    build: ./frontend
    expose:
      - "3000"
    volumes:
      - ./frontend:/app         # Связываем папку на диске с папкой в контейнере
      - frontend_node_modules:/app/node_modules  # Используем именованный том, чтобы инициализировать модули из образа
    environment:
      - WATCHPACK_POLLING=true

  # 3. Worker (Python)
  worker:
    build: ./worker
    depends_on:
      - redis

  # 4. Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 5. Redis
  redis:
    image: redis:7-alpine

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
volumes:
  postgres_data:
  frontend_node_modules: