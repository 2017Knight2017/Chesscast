services:
  backend:
    build: ./backend
    ports:
      - "3001:3000"
    command: >
      sh -c "bun run migrate && bun run dist/seed.js && bun run start:prod"
    environment:
      - DATABASE_URL=postgresql://admin:DBPASSWORD@db:5432/chess_platform?schema=public
      - REDIS_HOST=redis
      - PORT=3000
      - JWTKEY=YOURJWTKEY
      # Needs to be filled for archetype generation to work. Otherwise, random
      # archetype will be chosen unless user enters it manually on the /new page.
      - GEMINI_KEY=your_gemini_apikey  
    depends_on:
      - db
      - redis

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - redis
      - backend
    environment:
      - WATCHPACK_POLLING=true
      - NEST_API_URL=http://backend:3000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3001
  
  worker:
    build: ./worker_go
    restart: always
    environment:
      - REDIS_URL=redis:6379
      - BACKEND_URL=http://backend:3000
      - STOKFISH_PATH=/usr/games/stockfish
    volumes:
      - ./logs:/root/logs
    depends_on:
      - redis

  db:
    image: postgres:17-alpine 
    container_name: chess_platform
    restart: always
    ports:
      - "5432:5432" 
    environment:
      POSTGRES_USER: admin           
      POSTGRES_PASSWORD: DBPASSWORD    
      POSTGRES_DB: chess_platform  
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chess_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  drizzle_studio:
    build:
      context: ./backend
      dockerfile: Dockerfile.studio
    container_name: drizzle_studio
    ports:
      - "4983:4983"
    environment:
      - DATABASE_URL=postgresql://admin:DBPASSWORD:5432/chess_platform?schema=public
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data: