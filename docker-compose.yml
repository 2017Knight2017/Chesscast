services:
  backend:
    build: ./backend
    expose:
      - "3000"
    command: >
      sh -c "bun run migrate && bun run start:prod"
    environment:
      - DATABASE_URL=postgresql://admin:BtoiKe22dLq00N78@db:5432/chess_platform?schema=public
      - REDIS_HOST=redis
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    expose:
      - "3000"
    volumes:
      - ./frontend:/app     
      - frontend_node_modules:/app/node_modules 
    depends_on:
      - redis
    environment:
      - WATCHPACK_POLLING=true
      - NEST_API_URL=http://backend:3000

  worker:
    build: ./worker
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    environment:
      - BACKEND_URL=http://backend:3000

  db:
    image: postgres:17-alpine 
    container_name: chess_platform
    restart: always
    ports:
      - "5432:5432" 
    environment:
      POSTGRES_USER: admin           
      POSTGRES_PASSWORD: BtoiKe22dLq00N78    
      POSTGRES_DB: chess_platform  
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chess_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  drizzle_studio:
    build:
      context: ./backend
      dockerfile: Dockerfile.studio
    container_name: drizzle_studio
    ports:
      - "4983:4983"
    environment:
      - DATABASE_URL=postgresql://admin:BtoiKe22dLq00N78@db:5432/chess_platform?schema=public
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules: